name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd web-ui && npm ci

      - name: Backend type check
        run: npx tsc --noEmit

      - name: Frontend type check
        run: cd web-ui && npx tsc -b

      - name: Frontend lint
        run: cd web-ui && npm run lint

      - name: Unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd web-ui && npm ci

      - name: Build backend
        run: npm run build

      - name: Build frontend
        run: cd web-ui && npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t chitu .
