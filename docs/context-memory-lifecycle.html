<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Lifecycle — 记忆生命周期</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #a78bfa; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-left: 1.75rem; }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>Memory Lifecycle</h1>
      </div>
      <p class="subtitle">跨会话记忆：提取 → 存储 → 注入</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 960 500">
        <defs>
          <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa" />
          </marker>
          <marker id="ah-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
          </marker>
          <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- ===== ARROWS (drawn first) ===== -->

        <!-- Conv 1 → Extract -->
        <line x1="255" y1="100" x2="348" y2="100" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ah-violet)"/>
        <text x="300" y="92" fill="#a78bfa" font-size="8" text-anchor="middle">turn 结束</text>

        <!-- Extract → Storage -->
        <line x1="520" y1="100" x2="588" y2="100" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ah-violet)"/>
        <text x="554" y="92" fill="#94a3b8" font-size="8" text-anchor="middle">去重</text>

        <!-- Storage → Conv 2 (inject) -->
        <path d="M 665 185 L 665 235 Q 665 250, 650 250 L 525 250 Q 510 250, 510 265 L 510 275" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#ah-emerald)"/>
        <text x="590" y="243" fill="#34d399" font-size="8" text-anchor="middle">自动注入（最多 20 条）</text>

        <!-- Phase labels -->
        <text x="100" y="35" fill="#94a3b8" font-size="10" font-weight="600">Phase 1: 提取</text>
        <text x="430" y="35" fill="#94a3b8" font-size="10" font-weight="600">Phase 2: 存储</text>
        <text x="740" y="35" fill="#94a3b8" font-size="10" font-weight="600">Phase 3: 注入</text>

        <!-- ===== CONVERSATION 1 ===== -->
        <rect x="40" y="55" width="215" height="190" rx="12" fill="rgba(30, 41, 59, 0.15)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="52" y="73" fill="#94a3b8" font-size="9" font-weight="600">Conversation 1</text>

        <!-- User message -->
        <rect x="55" y="85" width="185" height="35" rx="4" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
        <text x="147" y="100" fill="#fbbf24" font-size="8" font-weight="600" text-anchor="middle">User:</text>
        <text x="147" y="113" fill="#94a3b8" font-size="7" text-anchor="middle">"用 pnpm 装依赖，用 tabs 缩进"</text>

        <!-- Assistant message -->
        <rect x="55" y="130" width="185" height="35" rx="4" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1"/>
        <text x="147" y="145" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle">Assistant:</text>
        <text x="147" y="158" fill="#94a3b8" font-size="7" text-anchor="middle">"好的，已安装并配置 tabs"</text>

        <!-- Tool call -->
        <rect x="55" y="175" width="185" height="35" rx="4" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1"/>
        <text x="147" y="190" fill="#22d3ee" font-size="8" font-weight="600" text-anchor="middle">Tool: exec</text>
        <text x="147" y="203" fill="#94a3b8" font-size="7" text-anchor="middle">pnpm install → exit 0 ✓</text>

        <!-- ===== LLM EXTRACT BOX ===== -->
        <rect x="350" y="55" width="170" height="130" rx="6" fill="#0f172a" stroke-width="0"/>
        <rect x="350" y="55" width="170" height="130" rx="6" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="435" y="78" fill="white" font-size="11" font-weight="600" text-anchor="middle">LLM 提取</text>
        <text x="435" y="95" fill="#a78bfa" font-size="8" text-anchor="middle">MemoryExtractor</text>

        <text x="435" y="118" fill="#94a3b8" font-size="8" text-anchor="middle">对话 → 摘要</text>
        <text x="435" y="132" fill="#94a3b8" font-size="8" text-anchor="middle">摘要 → LLM 提取</text>
        <text x="435" y="146" fill="#94a3b8" font-size="8" text-anchor="middle">结构化记忆条目</text>
        <text x="435" y="168" fill="#475569" font-size="7" text-anchor="middle">非阻塞 · 异步执行</text>

        <!-- ===== STORAGE ===== -->
        <rect x="590" y="55" width="150" height="130" rx="6" fill="#0f172a" stroke-width="0"/>
        <rect x="590" y="55" width="150" height="130" rx="6" fill="rgba(76, 29, 149, 0.2)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="665" y="78" fill="white" font-size="11" font-weight="600" text-anchor="middle">Storage</text>
        <text x="665" y="95" fill="#a78bfa" font-size="8" text-anchor="middle">memories.json</text>

        <text x="665" y="118" fill="#fbbf24" font-size="8" text-anchor="middle">• preference × 2</text>
        <text x="665" y="132" fill="#22d3ee" font-size="8" text-anchor="middle">• convention × 1</text>
        <text x="665" y="146" fill="#94a3b8" font-size="8" text-anchor="middle">• fact × 1</text>
        <text x="665" y="168" fill="#475569" font-size="7" text-anchor="middle">上限 100 条 · 原子写入</text>

        <!-- ===== CONVERSATION 2 ===== -->
        <rect x="340" y="255" width="340" height="200" rx="12" fill="rgba(6, 78, 59, 0.08)" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="352" y="273" fill="#34d399" font-size="9" font-weight="600">Conversation 2（新对话）</text>

        <!-- Injected memories -->
        <rect x="355" y="285" width="310" height="42" rx="4" fill="rgba(76, 29, 149, 0.2)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="510" y="300" fill="#a78bfa" font-size="8" font-weight="600" text-anchor="middle">[自动注入] Memories</text>
        <text x="510" y="316" fill="#94a3b8" font-size="7" text-anchor="middle">偏好: pnpm · tabs 缩进 | 约定: TypeScript ESM</text>

        <!-- User message -->
        <rect x="355" y="340" width="310" height="35" rx="4" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
        <text x="510" y="355" fill="#fbbf24" font-size="8" font-weight="600" text-anchor="middle">User: "帮我装个新依赖"</text>
        <text x="510" y="368" fill="#94a3b8" font-size="7" text-anchor="middle">（没说用什么包管理器）</text>

        <!-- Assistant response -->
        <rect x="355" y="385" width="310" height="50" rx="4" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1"/>
        <text x="510" y="402" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle">Assistant: "用 pnpm install 装依赖"</text>
        <text x="510" y="416" fill="#94a3b8" font-size="7" text-anchor="middle">→ exec("pnpm install xxx")</text>
        <text x="510" y="428" fill="#34d399" font-size="7" text-anchor="middle">✓ 记住了！没说也用 pnpm</text>

        <!-- ===== MEMORY CATEGORIES ===== -->
        <text x="40" y="280" fill="white" font-size="10" font-weight="600">5 种记忆类别</text>

        <rect x="40" y="295" width="140" height="24" rx="4" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1"/>
        <text x="110" y="311" fill="#fbbf24" font-size="8" text-anchor="middle">preference 用户偏好</text>

        <rect x="40" y="327" width="140" height="24" rx="4" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1"/>
        <text x="110" y="343" fill="#22d3ee" font-size="8" text-anchor="middle">convention 编码约定</text>

        <rect x="40" y="359" width="140" height="24" rx="4" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1"/>
        <text x="110" y="375" fill="#34d399" font-size="8" text-anchor="middle">architecture 架构决策</text>

        <rect x="40" y="391" width="140" height="24" rx="4" fill="rgba(136, 19, 55, 0.3)" stroke="#fb7185" stroke-width="1"/>
        <text x="110" y="407" fill="#fb7185" font-size="8" text-anchor="middle">failure 失败经验</text>

        <rect x="40" y="423" width="140" height="24" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1"/>
        <text x="110" y="439" fill="#94a3b8" font-size="8" text-anchor="middle">fact 关键事实</text>

        <!-- Constraints -->
        <text x="40" y="470" fill="#475569" font-size="8">约束: 最多 100 条存储 · 20 条注入/次 · 500 字符/条 · 子串去重</text>

      </svg>
    </div>

    <p class="footer">
      Memory Lifecycle &middot; Chitu (赤兔) &middot; 对话 → LLM 提取 → 存储 → 下次对话自动注入
    </p>
  </div>
</body>
</html>
