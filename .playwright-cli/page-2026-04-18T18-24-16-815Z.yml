              - generic [ref=e1251]: "{ \"path\": \"src/llm/client.ts\", \"content\": \"/**\\n * GLM-5 API 客户端\\n *\\n * 这是整个系统跟 LLM 通信的唯一入口。\\n * 做的事很简单：发 HTTP 请求，拿回回复。\\n *\\n * 学习重点：\\n * - LLM API 就是一个 HTTP 接口\\n * - messages 数组就是\\\"对话历史\\\"\\n * - function calling 让模型可以说\\\"我想调用某个工具\\\"\\n * - v14.2：新增 chatStream() 支持流式输出（SSE）\\n * - v17：集成 Prometheus metrics（LLM 请求计时 + 错误率）\\n */\\n\\n// ===== 类型定义 =====\\n\\n/** 一条消息，发给 LLM 或从 LLM 收到 */\\nexport interface Message {\\n role: 'system' | 'user' | 'assistant' | 'tool'\\n content: string | null\\n /** tool_calls：当模型想调用工具时，这个字段会有值 */\\n tool_calls?: ToolCall[]\\n /** tool_call_id：当这条消息是工具执行结果时，标识对应哪个工具调用 */\\n tool_call_id?: string\\n}\\n\\n/** 模型返回的工具调用请求 */\\nexport interface ToolCall {\\n id: string\\n type: 'function'\\n function: {\\n name: string\\n arguments: string // JSON 字符串，需要 parse\\n }\\n}\\n\\n/** 工具定义（告诉模型\\\"你可以用哪些工具\\\"） */\\nexport interface ToolDefinition {\\n type: 'function'\\n function: {\\n name: string\\n description: string\\n parameters: Record<string, unknown> // JSON Schema\\n }\\n}\\n\\n/** LLM 返回的完整结果 */\\nexport interface LLMResponse {\\n content: string | null\\n tool_calls: ToolCall[] | null\\n usage: {\\n prompt_tokens: number\\n completion_tokens: number\\n total_tokens: number\\n }\\n}\\n\\n/** 流式输出的一个 chunk */\\nexport interface StreamChunk {\\n /** 增量文本内容 */\\n delta: string\\n /** 是否结束 */\\n done: boolean\\n /** 工具调用（累积的，仅在完成时有值） */\\n tool_calls: ToolCall[] | null\\n /** usage（仅在最后一个 chunk） */\\n usage?: { prompt_tokens: number; completion_tokens: number; total_tokens: number }\\n}\\n\\n/** Metrics 接口（避免循环依赖） */\\nexport interface LlmMetrics {\\n startLlmTimer(): () => void\\n recordLlmRequest(status: string): void\\n}\\n\\n// ===== 客户端实现 =====\\n\\nexport class LLMClient {\\n private apiKey: string\\n private model: string\\n private endpoint: string\\n private metrics: LlmMetrics | null = null\\n\\n constructor() {\\n this.apiKey = process.env.ZHIPU_API_KEY || process.env.GLM_API_KEY || ''\\n this.model = 'glm-5'\\n this.endpoint = process.env.ZHIPU_CODING_ENDPOINT\\n || 'https://open.bigmodel.cn/api/coding/paas/v4/chat/completions'\\n\\n if (!this.apiKey) {\\n throw new Error('需要设置 ZHIPU_API_KEY 或 GLM_API_KEY 环境变量')\\n }\\n }\\n\\n /** 注入 metrics 实例（避免循环依赖） */\\n setMetrics(metrics: LlmMetrics): void {\\n this.metrics = metrics\\n }\\n\\n /**\\n * 带重试的 fetch — 指数退避（1s/2s/4s）\\n * 429（限流）和 5xx（服务端）自动重试，4xx（客户端）不重试\\n * 网络错误（DNS、连接超时、断网）也自动重试\\n */\\n private async fetchWithRetry(url: string, init: RequestInit, maxRetries = 3): Promise<Response> {\\n for (let attempt = 0; attempt <= maxRetries; attempt++) {\\n try {\\n const response = await fetch(url, init)\\n // 429 或 5xx → 重试\\n if ((response.status === 429 || response.status >= 500) && attempt < maxRetries) {\\n const delay = Math.pow(2, attempt) * 1000\\n console.warn(`[llm] ${response.status} on attempt ${attempt + 1}, retrying in ${delay}ms...`)\\n await new Promise(r => setTimeout(r, delay))\\n continue\\n }\\n return response\\n } catch (err: any) {\\n // 网络错误（ECONNREFUSED, ENOTFOUND, timeout, 断网）→ 重试\\n if (attempt < maxRetries) {\\n const delay = Math.pow(2, attempt) * 1000\\n console.warn(`[llm] network error on attempt ${attempt + 1}: ${err.message}, retrying in ${delay}ms...`)\\n await new Promise(r => setTimeout(r, delay))\\n continue\\n }\\n throw err\\n }\\n }\\n // unreachable but TypeScript needs it\\n throw new Error('Max retries exceeded')\\n }\\n\\n /**\\n * 调用 GLM-5（非流式）\\n */\\n async chat(messages: Message[], tools?: ToolDefinition[]): Promise<LLMResponse> {\\n const body: Record<string, unknown> = {\\n model: this.model,\\n messages,\\n stream: false,\\n max_tokens: 4096,\\n }\\n\\n if (tools && tools.length > 0) {\\n body.tools = tools\\n body.tool_choice = 'auto'\\n }\\n\\n const stopTimer = this.metrics?.startLlmTimer()\\n try {\\n const response = await this.fetchWithRetry(this.endpoint, {\\n method: 'POST',\\n headers: {\\n 'Content-Type': 'application/json',\\n 'Authorization': `Bearer ${this.apiKey}`,\\n },\\n body: JSON.stringify(body),\\n })\\n\\n if (!response.ok) {\\n this.metrics?.recordLlmRequest('error')\\n const text = await response.text()\\n throw new Error(`GLM API error ${response.status}: ${text}`)\\n }\\n\\n this.metrics?.recordLlmRequest('success')\\n\\n const data = await response.json()\\n const choice = data.choices?.[0]\\n\\n if (!choice) {\\n throw new Error('GLM API 返回了空响应')\\n }\\n\\n return {\\n content: choice.message.content || null,\\n tool_calls: choice.message.tool_calls || null,\\n usage: {\\n prompt_tokens: data.usage?.prompt_tokens || 0,\\n completion_tokens: data.usage?.completion_tokens || 0,\\n total_tokens: data.usage?.total_tokens || 0,\\n },\\n }\\n } catch (err) {\\n this.metrics?.recordLlmRequest('error')\\n throw err\\n } finally {\\n stopTimer?.()\\n }\\n }\\n\\n /**\\n * 流式调用 GLM-5（SSE）\\n *\\n * 对齐 OpenAI streaming 协议：\\n * - 发 stream: true，API 返回 SSE 事件流\\n * - 每个 chunk: data: {\\\"choices\\\":[{\\\"delta\\\":{\\\"content\\\":\\\"...\\\"}}]}\\n * - 结束: data: [DONE]\\n *\\n * @param onChunk - 每收到一个 chunk 就调用\\n * @returns 累积的完整响应（方便调用方）\\n */\\n async chatStream(\\n messages: Message[],\\n onChunk: (chunk: StreamChunk) => void,\\n tools?: ToolDefinition[],\\n ): Promise<LLMResponse> {\\n const body: Record<string, unknown> = {\\n model: this.model,\\n messages,\\n stream: true,\\n max_tokens: 16384,\\n stream_options: { include_usage: true },\\n }\\n\\n if (tools && tools.length > 0) {\\n body.tools = tools\\n body.tool_choice = 'auto'\\n }\\n\\n const stopTimer = this.metrics?.startLlmTimer()\\n let succeeded = false\\n\\n try {\\n const response = await this.fetchWithRetry(this.endpoint, {\\n method: 'POST',\\n headers: {\\n 'Content-Type': 'application/json',\\n 'Authorization': `Bearer ${this.apiKey}`,\\n },\\n body: JSON.stringify(body),\\n })\\n\\n if (!response.ok) {\\n this.metrics?.recordLlmRequest('error')\\n const text = await response.text()\\n throw new Error(`GLM API stream error ${response.status}: ${text}`)\\n }\\n\\n // 累积结果\\n let content = ''\\n const toolCallsMap = new Map<number, ToolCall>()\\n let usage = { prompt_tokens: 0, completion_tokens: 0, total_tokens: 0 }\\n\\n // 解析 SSE 流\\n const reader = response.body!.getReader()\\n const decoder = new TextDecoder()\\n let buffer = ''\\n\\n try {\\n while (true) {\\n const { done, value } = await reader.read()\\n if (done) break\\n\\n buffer += decoder.decode(value, { stream: true })\\n const lines = buffer.split('\\\\n')\\n buffer = lines.pop() ?? ''\\n\\n for (const line of lines) {\\n const trimmed = line.trim()\\n if (!trimmed || !trimmed.startsWith('data: ')) continue\\n\\n const data = trimmed.slice(6)\\n if (data === '[DONE]') {\\n onChunk({ delta: '', done: true, tool_calls: null, usage })\\n break\\n }\\n\\n try {\\n const parsed = JSON.parse(data)\\n const choice = parsed.choices?.[0]\\n\\n if (choice) {\\n const textDelta = choice.delta?.content\\n if (textDelta) {\\n content += textDelta\\n onChunk({ delta: textDelta, done: false, tool_calls: null })\\n }\\n\\n if (choice.delta?.tool_calls) {\\n for (const tc of choice.delta.tool_calls) {\\n const idx = tc.index ?? 0\\n if (!toolCallsMap.has(idx)) {\\n toolCallsMap.set(idx, {\\n id: tc.id || '',\\n type: 'function',\\n function: { name: '', arguments: '' },\\n })\\n }\\n const existing = toolCallsMap.get(idx)!\\n if (tc.id) existing.id = tc.id\\n if (tc.function?.name) existing.function.name += tc.function.name\\n if (tc.function?.arguments) existing.function.arguments += tc.function.arguments\\n }\\n }\\n }\\n\\n if (parsed.usage) {\\n usage = {\\n prompt_tokens: parsed.usage.prompt_tokens || 0,\\n completion_tokens: parsed.usage.completion_tokens || 0,\\n total_tokens: parsed.usage.total_tokens || 0,\\n }\\n }\\n } catch {\\n // 跳过无法解析的行\\n }\\n }\\n }\\n } finally {\\n try { reader.releaseLock() } catch { /* already released */ }\\n }\\n\\n // 组装最终结果\\n const toolCalls = toolCallsMap.size > 0\\n ? Array.from(toolCallsMap.values())\\n : null\\n\\n this.metrics?.recordLlmRequest('success')\\n succeeded = true\\n\\n return {\\n content: content || null,\\n tool_calls: toolCalls,\\n usage,\\n }\\n } catch (err) {\\n if (!succeeded) {\\n this.metrics?.recordLlmRequest('error')\\n }\\n throw err\\n } finally {\\n stopTimer?.()\\n }\\n }\\n}\\n\" }"
